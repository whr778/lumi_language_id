[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# Distribution name on PyPI. The import name stays `lumi_language_id`.
name = "lumi-language-id-2"
version = "2.0.0"
description = "For when you want fastText language identification, but you also want to believe the answers"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.txt"]
requires-python = ">=3.9"
keywords = ["language-identification", "language-detection", "fasttext", "nlp"]
authors = [
    { name = "Robyn Speer", email = "rspeer@luminoso.com" },
]
maintainers = [
    { name = "William Roe", email = "whr778@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    # 'fasttext-numpy2' is a drop-in fork of 'fasttext' (same `fasttext`
    # module) with the one-line fix needed for numpy >= 2 compatibility.
    "fasttext-numpy2",
    "numpy",
    "ftfy",
    "langcodes>=2",
]

[project.optional-dependencies]
# Training the tuned model requires scikit-learn, but using the model doesn't.
train = ["scikit-learn"]

[dependency-groups]
dev = ["pytest"]

[project.urls]
Repository = "https://github.com/whr778/lumi_language_id"

[tool.hatch.build.targets.wheel]
packages = ["lumi_language_id"]
